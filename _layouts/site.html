<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:title" content="{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/images/jae.jpg' | absolute_url }}">
  <link rel="icon" type="image/jpeg" href="{{ '/images/jae.jpg' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header" data-header>
    <div class="site-header__inner">
      <a class="site-logo" href="{{ '/' | relative_url }}">Jae Ho Chang</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" data-nav-toggle>
        <span class="nav-toggle__label">Menu</span>
        <span class="nav-toggle__bars" aria-hidden="true"></span>
      </button>
      <nav id="site-nav" class="site-nav" data-nav>
        <a href="{{ '/' | relative_url }}#news">News</a>
        <a href="{{ '/' | relative_url }}#research">Research</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/files/jaechang_cv.pdf' | relative_url }}">CV</a>
        <a class="site-nav__cta" href="mailto:jae.chang@yale.edu">Email</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p class="site-footer__brand">Jae Ho Chang, Ph.D.</p>
      <p class="site-footer__meta">Postdoctoral Researcher · Yale University</p>
      <p class="site-footer__links">
        <a href="mailto:jae.chang@yale.edu">Email</a>
        <a href="https://scholar.google.com/citations?user=WLt_rj8AAAAJ&hl=en">Google Scholar</a>
        <a href="https://github.com/jaehochang92">GitHub</a>
        <a href="{{ '/files/jaechang_cv.pdf' | relative_url }}">CV</a>
      </p>
      <p class="site-footer__copy">&copy; {{ site.time | date: '%Y' }} Jae Ho Chang</p>
    </div>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
